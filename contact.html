<!DOCTYPE html>
<html lang="fr">
<head>

</head>
<body>
    <header class="barre-navigation">
        <h1 class="marque">
            <a href="index.html">
                <img src="src/assets/svg/logo-messagerie.svg" alt="">
                <span data-i18n="brand">Messagerie instantanée</span>
            </a>
        </h1>
        <nav class="navigation-principale" aria-label="Navigation principale">
            <ul>
                <li>
                    <a href="conversations.html">
                        <img src="src/assets/svg/conversations.svg" alt="">

                </li>
                <li>

                        <img src="src/assets/svg/contacts.svg" alt="">

        <section>

                <li>Test invitation</li>

    </footer>
