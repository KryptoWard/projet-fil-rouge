<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title data-i18n="contacts_page_title">Contacts</title>
        <link rel="stylesheet" href="src/css/styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
        <header class="barre-navigation">
            <h1 class="marque">
                <a href="index.html">
                    <img src="src/assets/svg/logo-messagerie.svg" alt="" />
                    <span data-i18n="brand">Messagerie instantanée</span>
                </a>
            </h1>
            <nav class="navigation-principale" aria-label="Navigation principale">
                <ul>
                    <li>
                        <a href="conversations.html">
                            <img src="src/assets/svg/conversations.svg" alt="" />
                            <span data-i18n="conversations">Conversations</span>
                        </a>
                    </li>
                    <li>
                        <a href="contact.html" aria-current="page">
                            <img src="src/assets/svg/contacts.svg" alt="" />
                            <span data-i18n="contacts">Contacts</span>
                        </a>
                    </li>
                    <li>
                        <a href="settings.html">
                            <img src="src/assets/svg/parametres.svg" alt="" />
                            <span data-i18n="settings">Paramètres</span>
                        </a>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="bouton-langue"
                            id="langue-switch"
                            aria-label="Changer la langue d’affichage"
                        >
                            English
                        </button>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="pause-feuilles"
                            aria-label="Mettre les feuilles en pause"
                            title="Mettre les feuilles en pause"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="icone-pause">
                                    <rect x="6" y="5" width="4" height="14" rx="1.5" />
                                    <rect x="14" y="5" width="4" height="14" rx="1.5" />
                                </g>
                                <path
                                    class="icone-reprise"
                                    d="M8 5.8c0-.8.9-1.3 1.6-.9l9.1 6.2c.6.4.6 1.3 0 1.7l-9.1 6.2c-.7.5-1.6-.1-1.6-.9z"
                                />
                            </svg>
                        </button>
                    </li>
                </ul>
            </nav>
        </header>
        <div class="feuilles-automne" aria-hidden="true"></div>
        <main>
            <section>
                <h2 data-i18n="search_contact">Chercher un contact</h2>
                <form>
                    <label for="contact" data-i18n="contact">Nom du contact</label>
                    <input id="contact" name="contact" autocomplete="name" />
                    <button type="submit" data-i18n="invite">Inviter</button>
                </form>
            </section>
            <section>
                <h2>Invitations envoyées</h2>
                <ul>
                    <li>Test invitation</li>
                </ul>
            </section>
            <section>
                <h2>Invitations reçues</h2>
                <ul>
                    <li>Rien</li>
                </ul>
            </section>
            <section>
                <h2>Contacts</h2>
                <ul>
                    <li>Jean Dupont</li>
                </ul>
            </section>
        </main>

        <script src="src/js/supabase-client.js"></script>
        <script src="src/js/app.js"></script>
        <script src="src/js/automn.js"></script>
    </body>
</html>
