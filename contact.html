<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title data-i18n="contacts_page_title">Contacts</title>
        <link rel="stylesheet" href="src/css/styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
        <header class="barre-navigation">
            <h1 class="marque">
                <a href="index.html">
                    <img src="src/assets/svg/logo-messagerie.svg" alt="" />
                    <span data-i18n="brand">Messagerie instantanée</span>
                </a>
            </h1>
            <nav class="navigation-principale" aria-label="Navigation principale">
                <ul>
                    <li>
                        <a href="conversations.html">
                            <img src="src/assets/svg/conversations.svg" alt="" />
                            <span data-i18n="conversations">Conversations</span>
                        </a>
                    </li>
                    <li>
                        <a href="contact.html" aria-current="page">
                            <img src="src/assets/svg/contacts.svg" alt="" />
                            <span data-i18n="contacts">Contacts</span>
                        </a>
                    </li>
                    <li>
                        <a href="settings.html">
                            <img src="src/assets/svg/parametres.svg" alt="" />
                            <span data-i18n="settings">Paramètres</span>
                        </a>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="bouton-langue"
                            id="langue-switch"
                            aria-label="Changer la langue d’affichage"
                        >
                            English
                        </button>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="pause-feuilles"
                            aria-label="Mettre les feuilles en pause"
                            title="Mettre les feuilles en pause"
                            aria-pressed="false"
                        >
                            <img class="icone-pause" src="src/assets/svg/pause.svg" alt="" />
                            <img class="icone-reprise" src="src/assets/svg/reprendre.svg" alt="" />
                        </button>
                    </li>
                </ul>
            </nav>
        </header>
        <div class="feuilles-automne" aria-hidden="true"></div>
        <main>
            <section>
                <h2 data-i18n="search_contact">Chercher un contact</h2>
                <form id="form-ajouter-contact">
                    <label for="contact-name" data-i18n="contact">Nom du contact</label>
                    <input id="contact-name" name="contact" autocomplete="name"/>
                    <button type="submit" data-i18n="invite">Inviter</button>
                    <p id="contact-status" class="logout-error" hidden></p>
                </form>
            </section>

            <section>
                <h2>Invitations envoyées</h2>
                <ul id="liste-invitations-envoyees">
                    <li>Aucune invitation envoyée.</li>
                </ul>
            </section>

            <section>
                <h2>Invitations reçues</h2>
                <ul id="liste-invitations-recues">
                    <li>Aucune invitation reçue.</li>
                </ul>
            </section>

            <section>
                <h2>Contacts</h2>
                <ul id="liste-contacts">
                    <li>Aucun contact pour le moment.</li>
                </ul>
            </section>
        </main>
        <script src="src/js/app.js"></script>
        <script src="src/js/automn.js"></script>
        <script src="src/js/contact.js"></script>
    </body>
</html>
