<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie instantanée</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>

<body>
    <header>
        <h1 class="marque">
            <a href="index.html">
                <img src="src/assets/svg/logo-messagerie.svg" alt="">
                <span>Messagerie instantanée</span>
            </a>
        </h1>
        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="conversations.html"><img src="src/assets/svg/conversations.svg" alt=""><span>Conversations</span></a></li>
                <li><a href="contact.html"><img src="src/assets/svg/contacts.svg" alt=""><span>Contacts</span></a></li>
                <li><a href="settings.html"><img src="src/assets/svg/parametres.svg" alt=""><span>Paramètres</span></a></li>
                <li><button type="button" class="bouton-langue" id="langue-switch" aria-label="Changer la langue d’affichage">English</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Créer un compte</h2> <!-- Informations à donner pour avoir un compte -->
            <form action="">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" autocomplete="family-name">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" autocomplete="given-name">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" autocomplete="email">
                <label for="mdp">Mot de passe</label>
                <input type="password" id="mdp" name="mdp" autocomplete="new-password">
                <button type="submit">S'inscrire</button>
                <a href="pwdforgotten.html">Mot de passe oublié</a>
            </form>
        </section>
    </main>
    <footer>
    </footer>
    <script src="src/js/app.js"></script>
</body>

</html>
