<!doctype html>
<html lang="fr">
    <head>
        <script src="src/js/cookies.js"></script>
        <script type="text/javascript" src="https://embeds.iubenda.com/widgets/b2f2467f-7b2c-4f18-9189-a12d9ab6c546.js"></script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="site_title">Messagerie instantanée</title>
        <link rel="stylesheet" href="src/css/styles.css" />
        <script>
            console.log("bonjour ! je suis un exemple du cours d'introduction au JS :)");
        </script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>

    <body>
        <header class="barre-navigation">
            <h1 class="marque">
                <a href="index.html" aria-current="page">
                    <img src="src/assets/svg/logo-messagerie.svg" alt="" />
                    <span data-i18n="brand">Messagerie instantanée</span>
                </a>
            </h1>
            <nav class="navigation-principale" aria-label="Navigation principale">
                <ul>
                    <li>
                        <a href="conversations.html">
                            <img src="src/assets/svg/conversations.svg" alt="" />
                            <span data-i18n="conversations">Conversations</span>
                        </a>
                    </li>
                    <li>
                        <a href="contact.html">
                            <img src="src/assets/svg/contacts.svg" alt="" />
                            <span data-i18n="contacts">Contacts</span>
                        </a>
                    </li>
                    <li>
                        <a href="settings.html">
                            <img src="src/assets/svg/parametres.svg" alt="" />
                            <span data-i18n="settings">Paramètres</span>
                        </a>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="bouton-langue"
                            id="langue-switch"
                            aria-label="Changer la langue d’affichage"
                        >
                            English
                        </button>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="pause-feuilles"
                            aria-label="Mettre les feuilles en pause"
                            title="Mettre les feuilles en pause"
                            aria-pressed="false"
                        >
                            <img class="icone-pause" src="src/assets/svg/pause.svg" alt="" />
                            <img class="icone-reprise" src="src/assets/svg/reprendre.svg" alt="" />
                        </button>
                    </li>
                </ul>
            </nav>
        </header>
        <!-- Decorative layer only so leaves never block clicks -->
        <div class="feuilles-automne" aria-hidden="true"></div>
        <main>
            <section>
                <h2 data-i18n="create_account">Créer un compte</h2>
                <!-- Create an account -->
                <form id="form-inscription" action="">
                    <label for="nom" data-i18n="last_name">Nom</label>
                    <input type="text" id="nom" name="nom" autocomplete="family-name" />
                    <label for="prenom" data-i18n="first_name">Prénom</label>
                    <input type="text" id="prenom" name="prenom" autocomplete="given-name" />
                    <label for="email" data-i18n="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" />
                    <label for="mdp" data-i18n="password">Mot de passe</label>
                    <div class="champ-mot-de-passe">
                        <input type="password" id="mdp" name="mdp" autocomplete="new-password" />
                        <button type="button" class="voir-mot-de-passe" aria-controls="mdp" aria-label="Afficher le mot de passe" aria-pressed="false">
                            <img src="src/assets/svg/oeil-ferme.svg" alt="" width="22" height="22" />
                        </button>
                    </div>
                    <div class="captcha"></div>
                    <button type="submit" data-i18n="signup">S'inscrire</button>
                    <p class="message-formulaire" role="status" aria-atomic="true" hidden></p>
                </form>
            </section>
            <section>
                <h2>Connexion</h2>
                <!-- Sign in -->
                <form id="form-connexion" action="">
                    <label for="login-email" data-i18n="email">Adresse e-mail</label>
                    <input type="email" id="login-email" name="email" autocomplete="email" />
                    <label for="login-mdp" data-i18n="password">Mot de passe</label>
                    <div class="champ-mot-de-passe">
                        <input type="password" id="login-mdp" name="mdp" autocomplete="current-password" />
                        <button type="button" class="voir-mot-de-passe" aria-controls="login-mdp" aria-label="Afficher le mot de passe" aria-pressed="false">
                            <img src="src/assets/svg/oeil-ferme.svg" alt="" width="22" height="22" />
                        </button>
                    </div>
                    <div class="captcha"></div>
                    <button type="submit">Se connecter</button>
                    <p class="message-formulaire" role="status" aria-atomic="true" hidden></p>
                    <a href="pwdforgotten.html" data-i18n="forgotten_password">
                        Mot de passe oublié
                    </a>
                </form>
            </section>
        </main>
        <footer class="pied-de-page">
            <nav aria-label="Informations du site">
                <a href="a-propos.html" data-i18n="about">À propos</a>
                <a href="nous-contacter.html" data-i18n="contact_us">Nous contacter</a>
                <a href="mentions-legales.html#conditions" data-i18n="terms">Conditions d’utilisation</a>
                <a href="mentions-legales.html#confidentialite" data-i18n="privacy">Confidentialité</a>
                <a href="mentions-legales.html" data-i18n="legal">Mentions légales</a>
                <a href="mentions-legales.html#cookies" class="iubenda-cs-preferences-link" data-i18n="cookie_choices">Gérer les cookies</a>
            </nav>
        </footer>
        <script src="src/js/captcha.js"></script>
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&amp;onload=initialiserCaptcha" async defer></script>
        <script src="src/js/app.js"></script>
        <script src="src/js/automn.js"></script>
    </body>
</html>
