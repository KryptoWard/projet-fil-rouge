<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie instantanée</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>
    <header>
        <h1>Messagerie instantanée</h1>
        <nav>
            <ul>
                <li><a href="#">Accueil</a></li>
                <li><a href="#">Contacts</a></li>
                <li><a href="#">Paramètres</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Créer un compte</h2>
            <form action="">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" autocomplete="family-name">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" autocomplete="given-name">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" autocomplete="email">
                <label for="mdp">Mot de passe</label>
                <input type="password" id="mdp" name="mdp" autocomplete="new-password">
                <button type="submit">S'inscrire</button>
            </form>
        </section>
    </main>
    <footer>
    </footer>
    <script src="src/js/app.js"></script>
</body>

</html>
