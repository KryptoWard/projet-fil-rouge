<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title data-i18n="conversations_page_title">Conversations</title>
        <link rel="stylesheet" href="src/css/styles.css" />
        <link rel="stylesheet" href="src/css/conversations.css" />
        <!-- Keep the shared stylesheet aligned with the conversations page -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>

    <body class="conversation-page">
        <header class="barre-navigation">
            <h1 class="marque">
                <a href="index.html">
                    <img src="src/assets/svg/logo-messagerie.svg" alt="" />
                    <span data-i18n="brand">Messagerie instantanée</span>
                </a>
            </h1>
            <nav class="navigation-principale" aria-label="Navigation principale">
                <ul>
                    <li>
                        <a href="conversations.html" aria-current="page">
                            <img src="src/assets/svg/conversations.svg" alt="" />
                            <span data-i18n="conversations">Conversations</span>
                        </a>
                    </li>
                    <li>
                        <a href="contact.html">
                            <img src="src/assets/svg/contacts.svg" alt="" />
                            <span data-i18n="contacts">Contacts</span>
                        </a>
                    </li>
                    <li>
                        <a href="settings.html">
                            <img src="src/assets/svg/parametres.svg" alt="" />
                            <span data-i18n="settings">Paramètres</span>
                        </a>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="bouton-langue"
                            id="langue-switch"
                            aria-label="Changer la langue d’affichage"
                        >
                            English
                        </button>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="pause-feuilles"
                            aria-label="Mettre les feuilles en pause"
                            title="Mettre les feuilles en pause"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="icone-pause">
                                    <rect x="6" y="5" width="4" height="14" rx="1.5" />
                                    <rect x="14" y="5" width="4" height="14" rx="1.5" />
                                </g>
                                <path
                                    class="icone-reprise"
                                    d="M8 5.8c0-.8.9-1.3 1.6-.9l9.1 6.2c.6.4.6 1.3 0 1.7l-9.1 6.2c-.7.5-1.6-.1-1.6-.9z"
                                />
                            </svg>
                        </button>
                    </li>
                </ul>
            </nav>
        </header>
        <main class="page-conversations">
            <!-- Channel navigation and search share one compact sidebar -->
            <aside class="channel-sidebar" id="channel-sidebar" aria-labelledby="channels-heading">
                <header class="sidebar-heading">
                    <h2 id="channels-heading" data-chat-text="channels">Canaux</h2>
                    <span class="local-badge" id="chat-connection" role="status">Connexion...</span>
                </header>
                <search class="channel-search">
                    <label for="channel-search" class="visually-hidden" data-chat-text="search">
                        Rechercher un canal
                    </label>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="10.5" cy="10.5" r="6.5" />
                        <path d="m16 16 4 4" />
                    </svg>
                    <input
                        id="channel-search"
                        type="search"
                        placeholder="Rechercher un canal"
                        aria-label="Rechercher un canal"
                    />
                </search>
                <nav aria-label="Canaux" id="channels-navigation">
                    <ul id="channel-list" class="channel-list"></ul>
                    <p id="channel-no-results" data-chat-text="noResults" hidden>
                        Aucun canal trouvé.
                    </p>
                </nav>
                <button id="new-channel" class="new-channel" type="button">
                    <span aria-hidden="true">+</span>
                    <span data-chat-text="newChannel">Créer un canal</span>
                </button>
            </aside>
            <!-- The message thread scrolls independently from its composer -->
            <section class="chat-panel" aria-labelledby="channel-title">
                <div class="feuilles-automne" aria-hidden="true"></div>
                <header class="chat-heading">
                    <button
                        id="toggle-channels"
                        class="channel-toggle"
                        type="button"
                        aria-controls="channel-sidebar"
                        aria-expanded="false"
                        aria-label="Afficher les canaux"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 5h16v14H4zM10 5v14" />
                        </svg>
                    </button>
                    <span class="channel-symbol" aria-hidden="true">#</span>
                    <div class="channel-heading-text">
                        <h2 id="channel-title">Général</h2>
                        <p id="channel-description"></p>
                    </div>
                </header>
                <div class="thread-scroll" id="thread-scroll">
                    <button type="button" id="load-older" class="load-older" hidden>
                        Messages précédents
                    </button>
                    <p id="chat-error" class="chat-error" role="alert" hidden></p>
                    <button type="button" id="retry-chat" class="load-older" hidden>
                        Réessayer
                    </button>
                    <div class="thread-welcome" id="thread-welcome">
                        <span class="welcome-symbol" aria-hidden="true">
                            <svg viewBox="0 0 48 48" fill="none">
                                <path
                                    d="M37 5C19 5 7 14 9 27c1 8 8 12 15 9C36 31 38 18 37 5Z"
                                    fill="#b68236"
                                />
                                <path
                                    d="M8 44 30 15M16 34l-2-13m9 4 9-2"
                                    stroke="#79553c"
                                    stroke-width="1.7"
                                    stroke-linecap="square"
                                />
                            </svg>
                        </span>
                        <h3 id="welcome-title"></h3>
                        <p data-chat-text="welcome">
                            La discussion commence ici. Partagez votre premier message.
                        </p>
                    </div>
                    <ol
                        id="message-list"
                        class="message-list"
                        aria-label="Messages"
                        aria-live="polite"
                        aria-relevant="additions"
                    ></ol>
                </div>
                <footer class="composer-wrap">
                    <form id="message-form" class="message-form">
                        <label for="message" class="visually-hidden" data-i18n="message">
                            Message :
                        </label>
                        <textarea
                            id="message"
                            rows="2"
                            maxlength="4000"
                            placeholder="Écris un message ou /meteo [ville]..."
                            data-i18n-placeholder="message_placeholder"
                        ></textarea>
                        <div class="composer-bottom">
                            <div
                                id="message-toolbar"
                                class="message-toolbar"
                                role="toolbar"
                                aria-label="Options du message"
                            >
                                <button
                                    type="button"
                                    id="share-weather"
                                    class="weather-share-button"
                                    aria-label="Partager une carte météo"
                                    title="Partager une carte météo"
                                >
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <circle
                                            cx="9"
                                            cy="8"
                                            r="3"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                        />
                                        <path
                                            d="M9 1.5v2M9 12.5v2M2.5 8h2M13.5 8h2M4.4 3.4l1.4 1.4m6.4 6.4 1.4 1.4m0-9.2-1.4 1.4m-6.4 6.4-1.4 1.4M6 18h11a3.5 3.5 0 0 0 .3-7A5.4 5.4 0 0 0 7 12.5 2.8 2.8 0 0 0 6 18Z"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            stroke-width="1.8"
                                        />
                                    </svg>
                                    <span data-i18n="weather_tool_label">Météo</span>
                                </button>
                            </div>
                            <button type="submit" class="send-message">
                                <span data-i18n="send">Envoyer</span>
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="m4 11 16-7-7 16-2-7-7-2Zm7 2 9-9" />
                                </svg>
                            </button>
                        </div>
                    </form>
                    <p id="weather-status" class="weather-status" role="status"></p>
                </footer>
            </section>
        </main>
        <dialog id="channel-dialog" class="channel-dialog" aria-labelledby="channel-dialog-title">
            <form id="channel-create-form">
                <h2 id="channel-dialog-title" data-chat-text="newChannel">Créer un canal</h2>
                <p class="channel-audience" data-chat-text="shared">
                    Visible par tous les utilisateurs connectés du site.
                </p>
                <label for="channel-name" data-chat-text="name">Nom du canal</label>
                <input id="channel-name" name="name" required maxlength="40" autocomplete="off" />
                <label for="channel-topic" data-chat-text="topic">Description (facultatif)</label>
                <input id="channel-topic" name="topic" maxlength="120" autocomplete="off" />
                <p id="channel-error" role="alert" hidden></p>
                <div class="dialog-actions">
                    <button type="button" id="cancel-channel" data-chat-text="cancel">
                        Annuler
                    </button>
                    <button type="submit" data-chat-text="create">Créer</button>
                </div>
            </form>
        </dialog>
        <script src="src/js/supabase-client.js"></script>
        <script src="src/js/app.js"></script>
        <script src="src/js/automn.js"></script>
        <script src="src/js/chat-api.js"></script>
        <script src="src/js/weather.js"></script>
        <script src="src/js/conversations.js"></script>
    </body>
</html>
