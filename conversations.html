<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="conversations_page_title">Conversations</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <!-- Keep the shared stylesheet aligned with the conversations page -->
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <header class="barre-navigation">
        <h1 class="marque">
            <a href="index.html">
                <img src="src/assets/svg/logo-messagerie.svg" alt="">
                <span data-i18n="brand">Messagerie instantanée</span>
            </a>
        </h1>
        <nav class="navigation-principale" aria-label="Navigation principale">
            <ul>
                <li>
                    <a href="conversations.html">
                        <img src="src/assets/svg/conversations.svg" alt="">
                        <span data-i18n="conversations">Conversations</span>
                    </a>
                </li>
                <li>
                    <a href="contact.html">
                        <img src="src/assets/svg/contacts.svg" alt="">
                        <span data-i18n="contacts">Contacts</span>
                    </a>
                </li>
                <li>
                    <a href="settings.html">
                        <img src="src/assets/svg/parametres.svg" alt="">
                        <span data-i18n="settings">Paramètres</span>
                    </a>
                </li>
                <li><button type="button" class="bouton-langue" id="langue-switch" aria-label="Changer la langue d’affichage">English</button></li>
                <li><button type="button" class="pause-feuilles" aria-label="Mettre les feuilles en pause" title="Mettre les feuilles en pause" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g class="icone-pause"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></g><path class="icone-reprise" d="M8 5.8c0-.8.9-1.3 1.6-.9l9.1 6.2c.6.4.6 1.3 0 1.7l-9.1 6.2c-.7.5-1.6-.1-1.6-.9z"/></svg></button></li>
            </ul>
        </nav>
    </header>
    <div class="feuilles-automne" aria-hidden="true"></div>
    <main class="page-conversations">
        <nav>
            <section> <!-- Create a new conversation -->
                <h2 data-i18n="discussions">Discussions</h2>
                <form>
                    <button type="button" class="new_chat" data-i18n="new_conversation"> Nouvelle discussion+</button>
                </form>
            </section>

            <search> <!-- Search for a conversation -->
                <form role="search">
                    <label for="search" data-i18n="search_conversation">Rechercher une discussion</label>
                    <input type="text" id="search" placeholder="Rechercher..." data-i18n-placeholder="search_placeholder">
                </form>
            </search>
            <!-- Example conversation list -->
            <ul>
                <li><a href="#">Jean Dupont</a></li>
                <li><a href="#">Justin Trudeau</a></li>
            </ul>
        </nav>
        <section>
            <h2 data-i18n="active_conversation">Discussion active</h2> <!-- Example active conversation -->
                <ol id="message-list" class="message-list">
                <li>
                    <article>
                        <header>
                            <h3>Jean Dupont</h3>
                        </header>
                        <p>Salut !</p>
                        <footer>
                            <time datetime="16:00">16:00</time>
                        </footer>
                    </article>
                </li>
                <li>
                    <article>
                        <header>
                            <h3 data-i18n="me">Moi</h3>
                        </header>
                        <p>Yo</p>
                        <footer>
                            <time datetime="18:25">18:25</time>
                        </footer>
                    </article>
                </li>
            </ol>
            <!-- Compose a message or create a weather image with /meteo [city] -->
            <form id="message-form" class="message-form">
                <label for="message" data-i18n="message">Message :</label>
                <textarea id="message" placeholder="Ton message..." data-i18n-placeholder="message_placeholder"></textarea>
                <!-- Keep shareable content tools together in a small composer toolbar -->
                <div id="message-toolbar" class="message-toolbar" role="toolbar" aria-label="Options du message">
                    <!-- The first toolbar option creates and posts the configured weather image -->
                    <button type="button" id="share-weather" class="weather-share-button" aria-label="Partager une carte météo" title="Partager une carte météo">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M9 1.5v2M9 12.5v2M2.5 8h2M13.5 8h2M4.4 3.4l1.4 1.4m6.4 6.4 1.4 1.4m0-9.2-1.4 1.4m-6.4 6.4-1.4 1.4M6 18h11a3.5 3.5 0 0 0 .3-7A5.4 5.4 0 0 0 7 12.5 2.8 2.8 0 0 0 6 18Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                        </svg>
                        <span data-i18n="weather_tool_label">Météo</span>
                    </button>
                </div>
                <!-- Keep message submission separate from the content tools -->
                <div class="message-actions">
                    <button type="submit" data-i18n="send">Envoyer</button>
                </div>
            </form>
            <p id="weather-status" class="weather-status" aria-live="polite"></p>
        </section>
    </main>
    <footer>
    </footer>
    <script src="src/js/app.js"></script>
    <script src="src/js/automn.js"></script>
    <script src="src/js/weather.js"></script>
</body>

</html>
