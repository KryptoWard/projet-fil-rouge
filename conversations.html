<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="conversations_page_title">Conversations</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <!-- /!\ REVOIR LE STYLE.CSS À METTRE À JOUR EN RAPPORT AVEC CONVERSATIONS.HTML /!\ -->
</head>

<body>
    <header>
        <h1 data-i18n="my_conversations">Mes conversations</h1> <!-- Navigation principale -->
            <nav>
                <ul>
                    <li><a href="index.html"><span data-i18n="home">Accueil</span></a></li>
                    <li><a href="contact.html"><img src="src/assets/svg/contacts.svg" alt=""><span data-i18n="contacts">Contacts</span></a></li>
                    <li><a href="settings.html"><img src="src/assets/svg/parametres.svg" alt=""><span data-i18n="settings">Paramètres</span></a></li>
                <li><button type="button" class="bouton-langue" id="langue-switch" aria-label="Changer de langue">English</button></li>
                </ul>
            </nav>
    </header>
    <main>
        <nav>
            <section> <!-- Création d'une nouvelle discussion -->
                <h2 data-i18n="discussions">Discussions</h2>
                <button type="button" class="new_chat" data-i18n="new_conversation">Nouvelle discussion</button>
            </section>

            <search> <!-- Emplacement pour rechercher une discussion -->
                <form role="search">
                    <label for="search" data-i18n="search_conversation">Rechercher une discussion</label>
                    <input type="text" id="search" placeholder="Rechercher..." data-i18n-placeholder="search_placeholder">
                </form>
            </search>
            <!-- Exemple de liste des conversations -->
            <ul>
                <li><a href="#">Jean Dupont</a></li>
                <li><a href="#">Justin Trudeau</a></li>
            </ul>
        </nav>
        <section>
            <h2 data-i18n="active_conversation">Discussion active</h2> <!-- Exemple de conversation active -->
                <ol>
                <li>
                    <article>
                        <header>
                            <h3>Jean Dupont</h3>
                        </header>
                        <p>Salut !</p>
                        <footer>
                            <time datetime="16:00">16:00</time>
                        </footer>
                    </article>
                </li>
                <li>
                    <article>
                        <header>
                            <h3 data-i18n="me">Moi</h3>
                        </header>
                        <p>Yo</p>
                        <footer>
                            <time datetime="18:25">18:25</time>
                        </footer>
                    </article>
                </li>
            </ol>
            <!-- Écrire un message -->
            <form>
                <label for="message" data-i18n="message">Message :</label>
                <textarea id="message" placeholder="Ton message..." data-i18n-placeholder="message_placeholder"></textarea>
                <button type="submit" data-i18n="send">Envoyer</button>
            </form>
        </section>
    </main>
    <footer>
    </footer>
    <script src="src/js/app.js"></script>
</body>

</html>
