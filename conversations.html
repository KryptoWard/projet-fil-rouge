<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversations</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <!-- /!\ REVOIR LE STYLE.CSS À METTRE À JOUR EN RAPPORT AVEC CONVERSATIONS.HTML /!\ -->
</head>

<body>
    <header>
        <h1>Mes conversations</h1> <!-- Navigation principale -->
            <nav>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="contact.html">Contacts</a></li>
                    <li><a href="settings.html">Paramètres</a></li>
                </ul>
            </nav>
    </header>
    <main>
        <nav>
            <section> <!-- Création d'une nouvelle discussion -->
                <h2>Discussions</h2>
                <button type="button" class="new_chat">Nouvelle discussion</button>
            </section>

            <search> <!-- Emplacement pour rechercher une discussion -->
                <form role="search">
                    <label for="search">Rechercher une discussion</label>
                    <input type="text" id="search" placeholder="Rechercher...">
                </form>
            </search>
            <!-- Exemple de liste des conversations -->
            <ul>
                <li><a href="#">Jean Dupont</a></li>
                <li><a href="#">Justin Trudeau</a></li>
            </ul>
        </nav>
        <section>
            <h2>Discussion active</h2> <!-- Exemple de conversation active -->
                <ol>
                <li>
                    <article>
                        <header>
                            <h3>Jean Dupont</h3>
                        </header>
                        <p>Salut !</p>
                        <footer>
                            <time datetime="16:00">16:00</time>
                        </footer>
                    </article>
                </li>
                <li>
                    <article>
                        <header>
                            <h3>Moi</h3>
                        </header>
                        <p>Yo</p>
                        <footer>
                            <time datetime="18:25">18:25</time>
                        </footer>
                    </article>
                </li>
            </ol>
            <!-- Écrire un message -->
            <form>
                <label for="message">Message :</label>
                <textarea id="message" placeholder="Ton message..."></textarea>
                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>
    <footer>
    </footer>
    <script src="src/js/app.js"></script>
</body>

</html>
